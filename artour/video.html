<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FouriesM AR Platform</title>

<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/aframe.min.js"></script>
<script src="assets/js/mindar-image-aframe.prod.js"></script>
<style>

#ar-video {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

#ar-video.show {
    display: flex;
}

.video-content {
    width: min(94vw, 700px);
    padding: 10px;
    pointer-events: auto;
}

.video-card {
    background: rgba(0,0,0,.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 20px;
    padding: 10px;
    box-shadow:
        0 15px 40px rgba(0,0,0,.6);
}

.video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    background: #000;
    border-radius: 15px;
    overflow: hidden;
}

.video-container video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
}

.video-counter {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 10;
    color: white;
    background: rgba(0,0,0,.75);
    padding: 5px 10px;
    border-radius: 20px;
    font-size: .8rem;
}

.video-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 45px;
    height: 45px;
    border: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.7);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    font-size: 1.3rem;
}

.video-arrow:hover {
    background: #e60000;
}

.video-prev {
    left: 10px;
}

.video-next {
    right: 10px;
}

.video-title {
    color: white;
    text-align: center;
    font-size: 1.05rem;
    font-weight: 600;
    margin-top: 12px;
}

.video-dots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    margin-top: 10px;
}

.video-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,.4);
    cursor: pointer;
    transition: .2s;
}

.video-dot.active {
    width: 22px;
    border-radius: 10px;
    background: #e60000;
}

@media (max-width: 576px) {
    .video-content {
        width: 95vw;
        padding: 7px;
    }

    .video-card {
        padding:
        border-radius: 16px;
    }

    .video-arrow {
        width: 40px;
        height: 40px;
        font-size: 1.1rem;
    }

}

@media (
    max-height: 500px
) and (
    orientation: landscape
) {
    .video-content {
        width: min(75vw, 650px);
    }
    .video-container {
        aspect-ratio: 16 / 8;
    }
}

@media (min-width: 992px) {
    .video-content {
        width: min(65vw, 700px);
    }
}

</style>
</head>
<body>

<div id="custom-loading">
  <div class="loading-container">
    <img class="loading-photo" src="../assets/images/fsb7.jpg" />
  </div>
  <div class="loading-text">Loading...</div>
</div>

<!-- YOUR SCANNING HTML STAYS EXACTLY THE SAME -->
<div id="example-scanning-overlay">
  <div class="inner">
    <div class="scanline"></div>
    <img src="../assets/images/fsb7.jpg" />
  </div>
</div>


<!-- FALLBACK PRE-LOAD HUD -->
<div class="bg-primary text-center" id="status">FouriesM AR Platform</div>

<div id="ar-video">
    <div class="video-content">
        <div class="video-card">
            <div class="video-container">
                <video id="arVideo" playsinline controls preload="metadata">
                    <source id="videoSource" src="" type="video/mp4">
                    Your browser does not support video.
                </video>
                <div id="videoCounter" class="video-counter">
                    1 / 3
                </div>
                <button id="videoPrev" class="video-arrow video-prev" type="button">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <button id="videoNext" class="video-arrow video-next" type="button">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
            <div id="videoTitle" class="video-title">
                Fouriesburg Video 1
            </div>
            <div id="videoDots" class="video-dots"></div>
        </div>
    </div>
</div>

<a-scene mindar-image="imageTargetSrc: fouriesm.mind; uiLoading: #custom-loading; uiScanning: #example-scanning-overlay;" embedded xr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" color-space="sRGB" renderer="colorManagement:true">
  <a-camera position="0 0 0"></a-camera>
  <a-entity mindar-image-target="targetIndex:0">
     <a-plane position="0 0 0" width="2" height="1.2" color="#ffffff" opacity="0"></a-plane>
  </a-entity>
  
  <a-entity mindar-image-target="targetIndex:1">
     <a-plane position="0 0 0" width="2" height="1.2" color="#ffffff" opacity="0"></a-plane>
  </a-entity>
  
  <a-entity mindar-image-target="targetIndex:2">
     <a-plane position="0 0 0" width="2" height="1.2" color="#ffffff" opacity="0"></a-plane>
  </a-entity>
<script>

const videos = [
    {
        src: "../assets/video/vid1.mp4",
        title: "Fouriesburg Video 1"
    },
    {
        src: "../assets/video/vid2.mp4",
        title: "Fouriesburg Video 2"
    },
    {
        src: "../assets/video/vid3.mp4",
        title: "Fouriesburg Video 3"
    }
];

const target =
    document.querySelector(
        "[mindar-image-target]"
    );

const arVideo =
    document.querySelector(
        "#arVideo"
    );

const videoSource =
    document.querySelector(
        "#videoSource"
    );

const videoAR =
    document.querySelector(
        "#ar-video"
    );

const videoTitle =
    document.querySelector(
        "#videoTitle"
    );

const videoCounter =
    document.querySelector(
        "#videoCounter"
    );

const videoDots =
    document.querySelector(
        "#videoDots"
    );

const status =
    document.querySelector(
        "#status"
    );

let currentVideo = 0;
videos.forEach(
    (video, index) => {
        const dot =
            document.createElement("div");
        dot.className =
            "video-dot";
        if (index === 0) {
            dot.classList.add("active");
        }
        dot.addEventListener(
            "click",
            () => {
                currentVideo = index;
                showVideo();
            }
        );
        videoDots.appendChild(dot);
    }
);

function showVideo() {
    const video =
        videos[currentVideo];
    arVideo.pause();
    videoSource.src =
        video.src;
    arVideo.load();
    videoTitle.textContent =
        video.title;
    videoCounter.textContent =
        `${currentVideo + 1} / ${videos.length}`;
    document
        .querySelectorAll(".video-dot")
        .forEach(
            (dot, index) => {
                dot.classList.toggle(
                    "active",
                    index === currentVideo
                );
            }
        );
}

document
    .querySelector("#videoNext")
    .addEventListener(
        "click",
        () => {
            currentVideo++;
            if (
                currentVideo >=
                videos.length
            ) {
                currentVideo = 0;
            }
            showVideo();
        }
    );
document
    .querySelector("#videoPrev")
    .addEventListener(
        "click",
        () => {
            currentVideo--;
            if (
                currentVideo < 0
            ) {
                currentVideo =
                    videos.length - 1;
            }
            showVideo();
        }
    );
target.addEventListener(
    "targetFound",
    () => {
        console.log(
            "TARGET FOUND"
        );
        videoAR.classList.add(
            "show"
        );
        status.style.display =
            "block";
        currentVideo = 0;
        showVideo();
    }
);

target.addEventListener(
    "targetLost",
    () => {
        console.log(
            "TARGET LOST"
        );
        videoAR.classList.remove(
            "show"
        );
        arVideo.pause();
        arVideo.currentTime = 0;
        status.style.display =
            "none";
    }
);

showVideo();
</script>
</body>

</html>
