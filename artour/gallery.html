<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FouriesM AR Platform</title>

<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/aframe.min.js"></script>
<script src="assets/js/mindar-image-aframe.prod.js"></script>

<style>

#ar-gallery {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: none;
    pointer-events: none;
    align-items: center;
    justify-content: center;
}

#ar-gallery.show {
    display: flex;
}

#ar-gallery .gallery-content {
    pointer-events: auto;
    width: min(92vw, 600px);
    padding: 15px;
}

.gallery-card {
    width: 100%;
    background: rgba(0, 0, 0, .72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, .2);
    border-radius: 20px;
    padding: 12px;
    box-shadow:
        0 15px 40px rgba(0, 0, 0, .45);
}

.gallery-image-container {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    border-radius: 15px;
    background: #111;
}

.gallery-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    transition:
        opacity .25s ease,
        transform .25s ease;
}

.gallery-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, .65);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    z-index: 5;
    transition: .2s ease;
}

.gallery-arrow:hover {
    background: rgba(230, 0, 0, .9);
}

.gallery-prev {
    left: 10px;
}

.gallery-next {
    right: 10px;
}

.gallery-counter {
    position: absolute;
    right: 10px;
    top: 10px;
    background: rgba(0, 0, 0, .65);
    color: white;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: .8rem;
    z-index: 5;
}

.gallery-title {
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    margin-top: 12px;
    text-align: center;
}

.gallery-dots {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-top: 12px;
}

.gallery-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .4);
    transition: .2s ease;
}

.gallery-dot.active {
    width: 22px;
    border-radius: 10px;
    background: #e60000;
}

@media (max-width: 576px) {
    .gallery-content {
        width: 94vw !important;
        padding: 8px !important;
    }
    .gallery-card {
        padding: 8px;
        border-radius: 16px;
    }

    .gallery-arrow {
        width: 40px;
        height: 40px;
        font-size: 1.2rem;
    }
}

@media (max-height: 500px) and (orientation: landscape) {
    .gallery-content {
        width: min(70vw, 600px);
    }
    .gallery-image-container {
        aspect-ratio: 16 / 7;
    }
}

@media (min-width: 992px) {
    .gallery-content {
        width: min(60vw, 650px);
    }
}

</style>
</head>
<body>

<div id="custom-loading">
  <div class="loading-container">
    <img class="loading-photo" src="../assets/images/fsb7.jpg" />
  </div>
  <div class="loading-text">Loading...</div>
</div>

<!-- YOUR SCANNING HTML STAYS EXACTLY THE SAME -->
<div id="example-scanning-overlay">
  <div class="inner">
    <div class="scanline"></div>
    <img src="../assets/images/fsb7.jpg" />
  </div>
</div>


<!-- FALLBACK PRE-LOAD HUD -->
<div class="bg-primary text-center" id="status">FouriesM AR Platform</div>

<div id="ar-gallery">
    <div class="gallery-content">
        <div class="gallery-card">
            <div
                class="gallery-image-container" id="gallerySwipeArea">
                <img id="galleryImage"class="gallery-image" src="../assets/images/dms1.jpg" alt="Gallery image">
                <div
                    id="galleryCounter"
                    class="gallery-counter"
                >
                    1 / 5
                </div>
                <button id="galleryPrev" class="gallery-arrow gallery-prev" type="button" aria-label="Previous image">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <button id="galleryNext" class="gallery-arrow gallery-next" type="button" aria-label="Next image">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
            <div id="galleryTitle" class="gallery-title">
                Image 1
            </div>
            <div id="galleryDots" class="gallery-dots"></div>
        </div>
    </div>
</div>

<a-scene mindar-image="imageTargetSrc: fouriesm.mind; uiLoading: #custom-loading; uiScanning: #example-scanning-overlay;" embedded xr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" color-space="sRGB" renderer="colorManagement:true">
  <a-camera position="0 0 0"></a-camera>
  <a-entity mindar-image-target="targetIndex:0">
     <a-plane position="0 0 0" width="2" height="1.2" color="#ffffff" opacity="0"></a-plane>
  </a-entity>
  
  <a-entity mindar-image-target="targetIndex:1">
     <a-plane position="0 0 0" width="2" height="1.2" color="#ffffff" opacity="0"></a-plane>
  </a-entity>
  
  <a-entity mindar-image-target="targetIndex:2">
     <a-plane position="0 0 0" width="2" height="1.2" color="#ffffff" opacity="0"></a-plane>
  </a-entity>
</a-scene>

<script>

const galleryImages = [
    {
        src: "../assets/images/dms1.jpg",
        title: "Fouriesburg Gallery Image 1"
    },
    {
        src: "../assets/images/fsb1.jpg",
        title: "Fouriesburg Gallery Image 2"
    },
    {
        src: "../assets/images/fsb7.jpg",
        title: "Fouriesburg Gallery Image 3"
    },
    {
        src: "../assets/images/fsb9.jpg",
        title: "Fouriesburg Gallery Image 4"
    },
    {
        src: "../assets/images/ssc1.jpg",
        title: "Fouriesburg Gallery Image 5"
    }
];

const gallery = document.querySelector("#ar-gallery");
const galleryImage = document.querySelector("#galleryImage");
const galleryTitle = document.querySelector("#galleryTitle");
const galleryCounter = document.querySelector("#galleryCounter");
const galleryDots = document.querySelector("#galleryDots");
const galleryPrev = document.querySelector("#galleryPrev");
const galleryNext = document.querySelector("#galleryNext");
const swipeArea = document.querySelector("#gallerySwipeArea");
const status = document.querySelector("#status");
const target = document.querySelector("[mindar-image-target]");

let currentImage = 0;

galleryImages.forEach((image, index) => {
    const dot = document.createElement("div");
    dot.className = "gallery-dot";
    dot.addEventListener("click", () => {
        currentImage = index;
        showImage();
    });
    galleryDots.appendChild(dot);
});

function showImage() {
    const image = galleryImages[currentImage];
    galleryImage.style.opacity = "0";
    setTimeout(() => {
        galleryImage.src = image.src;
        galleryImage.alt = image.title;
        galleryTitle.textContent = image.title;
        galleryCounter.textContent =
            `${currentImage + 1} / ${galleryImages.length}`;
        galleryImage.style.opacity = "1";
    }, 120);
    document
        .querySelectorAll(".gallery-dot")
        .forEach((dot, index) => {
            dot.classList.toggle(
                "active",
                index === currentImage
            );
        });
}

function nextImage() {
    currentImage++;
    if (currentImage >= galleryImages.length) {
        currentImage = 0;
    }
    showImage();
}

function previousImage() {
    currentImage--;
    if (currentImage < 0) {
        currentImage = galleryImages.length - 1;
    }
    showImage();
}

galleryNext.addEventListener(
    "click",
    nextImage
);
galleryPrev.addEventListener(
    "click",
    previousImage
);

let touchStartX = 0;
let touchEndX = 0;

swipeArea.addEventListener(
    "touchstart",
    (event) => {
        touchStartX =
            event.changedTouches[0].screenX;
    },
    {
        passive: true
    }
);

swipeArea.addEventListener(
    "touchend",
    (event) => {
        touchEndX =
            event.changedTouches[0].screenX;
        handleSwipe();
    },
    {
        passive: true
    }
);

function handleSwipe() {
    const difference =
        touchEndX - touchStartX;

    if (Math.abs(difference) < 50) {
        return;
    }
    if (difference < 0) {
        nextImage();
    } else {
        previousImage();
    }
}

target.addEventListener(
    "targetFound",
    () => {
        console.log(
            "MARKER FOUND - SHOWING CAROUSEL"
        );
        gallery.classList.add("show");
        status.style.display = "block";
        currentImage = 0;
        showImage();
    }
);

target.addEventListener(
    "targetLost",
    () => {
        console.log(
            "MARKER LOST - HIDING CAROUSEL"
        );
        gallery.classList.remove("show");
        status.style.display = "none";
    }
);

showImage();
</script>

</body>
</html>
